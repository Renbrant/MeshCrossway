name: Firmware preflight (no website deployment)

on:
  push:
    branches:
      - development/wifi-capture-preflight
    paths:
      - "firmware/display-prototype/**"
      - "scripts/preflight_display.py"
      - "scripts/preflight_firmware_catalog.py"
      - "scripts/check_firmware_identity.py"
      - ".github/workflows/firmware-preflight.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/display-prototype/**"
      - "scripts/preflight_display.py"
      - ".github/workflows/firmware-preflight.yml"
      - "docs/site/flasher/**"
      - "scripts/build_firmware_versions.sh"
      - "scripts/write_firmware_*.py"
      - "scripts/verify_firmware_version.py"
      - "scripts/preflight_firmware_catalog.py"
      - "scripts/check_firmware_identity.py"
      - ".github/workflows/ui-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout MeshCrossway
        uses: actions/checkout@v4

      - name: Offline syntax and patcher checks
        run: python3 scripts/preflight_display.py

      # The archive job below is the single authoritative ESP-IDF build.
      # This job checks syntax/patcher invariants only, avoiding a duplicate
      # full BSP checkout and ESP-IDF compilation on every pull request.

  version_catalog:
    name: Archive preflight (no Pages deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check selector JavaScript and build scripts
        run: python3 scripts/preflight_firmware_catalog.py
      - name: Restore v0.3 recovery binary
        uses: actions/cache@v4
        with:
          path: _site/flasher/firmware/versions/v0.3.0
          key: meshcrossway-v030-b48145f0-bsp-d9ff7837-idf532-v1
      - name: Restore v0.4 recovery binary
        uses: actions/cache@v4
        with:
          path: _site/flasher/firmware/versions/v0.4.0
          key: meshcrossway-v040-5dfe3744-bsp-d9ff7837-idf532-v1
      - name: Restore source-keyed firmware cache
        uses: actions/cache@v4
        with:
          path: _site/flasher/firmware/versions
          key: meshcrossway-current-${{ hashFiles('firmware/display-prototype/**', 'scripts/build_firmware_versions.sh', 'scripts/write_firmware_version.py') }}-idf532-bsp-d9ff7837-v2
      - name: Compile archived versions and current firmware
        run: bash scripts/build_firmware_versions.sh
      - name: Verify compiled catalog and manifests
        run: python3 scripts/preflight_firmware_catalog.py --catalog _site/flasher/firmware/catalog.json
      - name: Verify embedded firmware UI version
        run: python3 scripts/check_firmware_identity.py
      - name: Retain test artifacts, never publish Pages
        uses: actions/upload-artifact@v4
        with:
          name: firmware-version-archive-preflight
          path: _site/flasher/firmware
          if-no-files-found: error
