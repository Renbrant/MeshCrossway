name: Firmware preflight (no website deployment)

on:
  push:
    branches:
      - development/wifi-capture-preflight
    paths:
      - "firmware/display-prototype/**"
      - "scripts/preflight_display.py"
      - "scripts/preflight_firmware_catalog.py"
      - "scripts/check_firmware_identity.py"
      - "scripts/check_ble_sdkconfig.py"
      - "scripts/test_ble_sdkconfig.py"
      - "scripts/test_ble_resume.py"
      - "scripts/test_runtime_diagnostics.py"
      - "scripts/test_ble_pairing_ui.py"
      - "scripts/test_map_navigation.py"
      - "tests/map_navigation_test.cpp"
      - "tests/map_projection_test.cpp"
      - "tests/gnss_runtime_test.cpp"
      - "tests/home_status_test.cpp"
      - "tests/home_cards_test.cpp"
      - "tests/navigation_store_test.cpp"
      - "tests/navigation_runtime_test.cpp"
      - "scripts/check_chat_memory.py"
      - "scripts/test_conversations_history.py"
      - "tests/conversations_history_test.cpp"
      - "tests/sd_history_worker_test.cpp"
      - "tests/meshcore_transport_test.cpp"
      - "scripts/test_meshtastic.py"
      - "tests/meshtastic_protocol_test.cpp"
      - "tests/meshtastic_runtime_test.cpp"
      - "scripts/test_meshcore.py"
      - "scripts/test_edge_swipe.py"
      - "scripts/test_battery_decode.py"
      - "scripts/test_chat_presentation.py"
      - "tests/test_chat_presentation.cpp"
      - "tests/test_emoji_sprite.cpp"
      - "tests/test_battery_decode.cpp"
      - "tests/test_edge_swipe.cpp"
      - "tests/meshcore_protocol_test.cpp"
      - "scripts/restore_reviewed_firmware.py"
      - "scripts/ci_change_scope.py"
      - "scripts/test_ci_change_scope.py"
      - ".github/workflows/firmware-preflight.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/display-prototype/**"
      - "scripts/preflight_display.py"
      - ".github/workflows/firmware-preflight.yml"
      - "docs/site/flasher/**"
      - "scripts/build_firmware_versions.sh"
      - "scripts/write_firmware_*.py"
      - "scripts/verify_firmware_version.py"
      - "scripts/preflight_firmware_catalog.py"
      - "scripts/check_firmware_identity.py"
      - "scripts/check_ble_sdkconfig.py"
      - "scripts/test_ble_sdkconfig.py"
      - "scripts/test_ble_resume.py"
      - "scripts/test_runtime_diagnostics.py"
      - "scripts/test_ble_pairing_ui.py"
      - "scripts/test_map_navigation.py"
      - "tests/map_navigation_test.cpp"
      - "tests/map_projection_test.cpp"
      - "tests/gnss_runtime_test.cpp"
      - "tests/home_status_test.cpp"
      - "tests/home_cards_test.cpp"
      - "tests/navigation_store_test.cpp"
      - "tests/navigation_runtime_test.cpp"
      - "scripts/check_chat_memory.py"
      - "scripts/test_conversations_history.py"
      - "tests/conversations_history_test.cpp"
      - "tests/sd_history_worker_test.cpp"
      - "tests/meshcore_transport_test.cpp"
      - "scripts/test_meshtastic.py"
      - "tests/meshtastic_protocol_test.cpp"
      - "tests/meshtastic_runtime_test.cpp"
      - "scripts/test_meshcore.py"
      - "scripts/test_edge_swipe.py"
      - "scripts/test_battery_decode.py"
      - "scripts/test_chat_presentation.py"
      - "tests/test_chat_presentation.cpp"
      - "tests/test_emoji_sprite.cpp"
      - "tests/test_battery_decode.cpp"
      - "tests/test_edge_swipe.cpp"
      - "tests/meshcore_protocol_test.cpp"
      - "scripts/restore_reviewed_firmware.py"
      - "scripts/ci_change_scope.py"
      - "scripts/test_ci_change_scope.py"
      - ".github/workflows/ui-pages.yml"
  workflow_dispatch:

# GitHub retains cancelled attempts in history, but only the newest commit
# of a given PR can continue compiling. Other PRs remain independent.
concurrency:
  group: firmware-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout MeshCrossway
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify PR changes (code versus documentation/website)
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/ci_change_scope.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Offline syntax and patcher checks
        run: |
          python3 scripts/preflight_display.py
          python3 scripts/test_ble_sdkconfig.py
          python3 scripts/test_ble_resume.py
          python3 scripts/test_runtime_diagnostics.py
          python3 scripts/test_remote_chat.py
          python3 scripts/test_conversations_history.py
          python3 scripts/test_meshtastic.py
          python3 scripts/test_meshcore.py
          python3 scripts/test_emoji.py
          python3 scripts/test_edge_swipe.py
          python3 scripts/test_battery_decode.py
          python3 scripts/test_chat_presentation.py
          python3 scripts/test_device_key_audit.py
          python3 scripts/test_ci_change_scope.py
          python3 scripts/preflight_firmware_catalog.py

      # The archive job below is the single authoritative ESP-IDF build.
      # This job checks syntax/patcher invariants only, avoiding a duplicate
      # full BSP checkout and ESP-IDF compilation on every pull request.

  version_catalog:
    # Do not compile if only README/docs/site pages were edited.
    # The fast preflight still validates Web Flasher selector and syntax.
    needs: preflight
    if: needs.preflight.outputs.docs_only != 'true'
    name: Archive preflight (no Pages deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check selector JavaScript and build scripts
        run: python3 scripts/preflight_firmware_catalog.py
      - name: Restore source-keyed firmware cache
        uses: actions/cache@v4
        with:
          path: _site/flasher/firmware/versions
          key: meshcrossway-current-${{ hashFiles('scripts/test_map_navigation.py', 'tests/map_navigation_test.cpp', 'tests/map_projection_test.cpp', 'tests/gnss_runtime_test.cpp', 'tests/home_status_test.cpp', 'tests/home_cards_test.cpp', 'tests/navigation_store_test.cpp', 'tests/navigation_runtime_test.cpp', 'scripts/test_meshtastic.py', 'tests/meshtastic_protocol_test.cpp', 'tests/meshtastic_runtime_test.cpp', 'scripts/check_chat_memory.py', 'scripts/test_conversations_history.py', 'tests/conversations_history_test.cpp', 'tests/sd_history_worker_test.cpp', 'tests/meshcore_transport_test.cpp', 'scripts/test_ble_resume.py', 'scripts/test_runtime_diagnostics.py', 'firmware/display-prototype/**', 'scripts/build_firmware_versions.sh', 'scripts/write_firmware_version.py', 'scripts/check_ble_sdkconfig.py', 'scripts/test_ble_pairing_ui.py', 'scripts/test_meshcore.py', 'tests/meshcore_protocol_test.cpp') }}-idf532-bsp-d9ff7837-v2
      - name: Compile stable release and recent candidates
        run: bash scripts/build_firmware_versions.sh
      - name: Verify compiled catalog and manifests
        run: python3 scripts/preflight_firmware_catalog.py --catalog _site/flasher/firmware/catalog.json
      - name: Verify embedded firmware UI version
        run: python3 scripts/check_firmware_identity.py
      - name: Retain test artifacts, never publish Pages
        uses: actions/upload-artifact@v4
        with:
          name: firmware-version-archive-preflight
          path: _site/flasher/firmware
          if-no-files-found: error
      - name: Retain candidate ELF, map and effective configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ble-display-debug-symbols
          path: |
            _firmware_version_build/vendor-v*/examples/esp-idf/02_lvgl_example/build/*.elf
            _firmware_version_build/vendor-v*/examples/esp-idf/02_lvgl_example/build/*.map
            _firmware_version_build/vendor-v*/examples/esp-idf/02_lvgl_example/build/**/*.su
            _firmware_version_build/vendor-v*/examples/esp-idf/02_lvgl_example/sdkconfig
            _firmware_version_build/vendor-v*/examples/esp-idf/02_lvgl_example/dependencies.lock
          if-no-files-found: warn

