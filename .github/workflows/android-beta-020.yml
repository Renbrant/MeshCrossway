name: Publish Android 0.2.0 beta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-beta-020.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: android-beta-0.2.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '42648549926'
      SOURCE_SHA: 64da4bbe6ea555528a203525ea5844b49408d69e
      RELEASE_SHA: 25fa715857d50a1cc84e99e626182b1f2282f62d
    steps:
      - name: Verify exact source and successful Android test matrix
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .conclusion == "success"' run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > jobs.json
          jq -e '[.jobs[] | select(.name == "apk" or .name == "device-smoke (29)" or .name == "device-smoke (35)")] | length == 3 and all(.[]; .conclusion == "success")' jobs.json
          gh api "repos/$GH_REPO/commits/$RELEASE_SHA" > commit.json
          jq -e --arg sha "$RELEASE_SHA" '.sha == $sha' commit.json
      - name: Download approved APK from that exact CI run
        uses: actions/download-artifact@v4
        with:
          name: MeshCrossway-Android-0.1.0
          path: release
          run-id: 42648549926
          github-token: ${{ github.token }}
      - name: Publish signed public beta asset with SHA-256
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          test -s MeshCrossway-0.1.0.apk
          mv MeshCrossway-0.1.0.apk MeshCrossway-0.2.0.apk
          sha256sum MeshCrossway-0.2.0.apk > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          ## MeshCrossway Android 0.2.0 — local HTTPS Remote Workspace beta

          This is **public beta software for testing**, not version 1.0.0 or a production-ready remote administration service.

          ### What's new
          - Enable **Remote Access** from the Android Home card. When the phone and computer share private Wi-Fi, open the HTTPS address shown on the phone, verify the locally generated TLS certificate fingerprint, then enter the private session code.
          - Independent Meshtastic and MeshCore dashboard, contacts, conversations, sending/reading messages and channel information in a computer browser.
          - View, create by geographic bounds, pause/resume and delete MapLibre offline map areas stored on the phone, within the existing provider tile budgets.
          - Manage local GPS tracks with virtual folders, change track names/colors/visibility, preview and export GPX.
          - No bridging between networks, no cloud relay, no port forwarding and no automatic sharing of phone GPS coordinates with either radio network.

          ### Safety & limitations
          - HTTPS is locally self-signed. **Verify the SHA-256 certificate fingerprint displayed on your phone** before accepting a browser trust exception. Do not disable certificate checks globally.
          - Remote Access is off by default and binds only to the local Wi-Fi IPv4 address. Use only on a trusted network, and stop it when finished. No remote-internet access.
          - Desktop map downloads currently use geographic coordinate bounds rather than a draggable map rectangle. Offline map content downloads require internet on the phone and obey source rules.
          - Sending a message reports local radio-queue acceptance, not guaranteed delivery to another node.
          - This version has not been accepted yet on a physical Samsung Galaxy S25 with both BLE radios active, browser access, Doze and Wi-Fi transitions. Those are required field tests.

          ### Validation
          Source PR: https://github.com/Renbrant/MeshCrossway/pull/191
          CI run: https://github.com/Renbrant/MeshCrossway/actions/runs/42648549926
          APK build/lint, protocol fixtures and API 29 / API 35 instrumented emulator tests passed, including isolated TLS handshake, HTTPS login, session/CSRF rules and dual-radio state.

          ### Install / recovery
          Download MeshCrossway-0.2.0.apk below (ARM64, Android 8.0+). The APK is signed with the build's CI debug key; a different signing certificate from your installed version may prevent an in-place update. **Before uninstalling**, export required local message history and GPX tracks, since uninstall erases local data.
          [Android 0.1.1 recovery APK](https://github.com/Renbrant/MeshCrossway/releases/tag/android-v0.1.1) remains available unchanged.
          SHA-256 verification: see attached SHA256SUMS.txt.
          NOTES
          if gh release view android-v0.2.0 >/dev/null 2>&1; then
            mkdir previous
            gh release download android-v0.2.0 -p MeshCrossway-0.2.0.apk -D previous
            cmp previous/MeshCrossway-0.2.0.apk MeshCrossway-0.2.0.apk
            echo "Identical APK already published; refusing to overwrite existing release"
          else
            gh release create android-v0.2.0 MeshCrossway-0.2.0.apk SHA256SUMS.txt \
              --target "$RELEASE_SHA" \
              --title "Android 0.2.0 — Local HTTPS Remote Workspace beta" \
              --notes-file release-notes.md --prerelease --latest=false
          fi
