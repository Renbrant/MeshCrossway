name: Android Google Play bundle
# Builds a Google Play App Bundle (.aab) signed with the same permanent key as the
# GitHub APKs, verifies its certificate, and keeps it as a workflow artifact.
# If the PLAY_SERVICE_ACCOUNT_JSON secret exists, it also uploads the bundle to the
# requested Play track. The very first bundle of a new Play app must be uploaded
# manually in Play Console; later releases can use the automatic upload.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to bundle (must match android/app/build.gradle)'
        required: true
        default: '0.4.9'
        type: string
      track:
        description: 'Play track for the automatic upload'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: 'Release status on Play (draft needs manual rollout in Play Console)'
        required: true
        default: draft
        type: choice
        options: [draft, completed]
permissions:
  contents: read
concurrency:
  group: android-play-release
  cancel-in-progress: false
jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_clerkPublishableKey: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      ORG_GRADLE_PROJECT_cloudApiBaseUrl: ${{ vars.CLOUD_API_BASE_URL || 'https://meshcrossway-cloud.meshcrossway.workers.dev' }}
      MCX_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      MCX_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      MCX_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      MCX_EXPECTED_CERT: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
      RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify version and permanent signing credentials
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          grep -Fq "versionName '$REQUESTED'" android/app/build.gradle ||
            { echo "The requested version does not match source code"; exit 1; }
          for name in RELEASE_KEYSTORE_B64 MCX_SIGNING_STORE_PASSWORD MCX_SIGNING_KEY_ALIAS MCX_SIGNING_KEY_PASSWORD MCX_EXPECTED_CERT; do
            if [ -z "${!name}" ]; then echo "Missing permanent signing GitHub secret $name"; exit 1; fi
          done
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/meshcrossway-release.p12"
          chmod 600 "$RUNNER_TEMP/meshcrossway-release.p12"
          printf 'MCX_SIGNING_KEYSTORE=%s\n' "$RUNNER_TEMP/meshcrossway-release.p12" >> "$GITHUB_ENV"
      - name: Unit tests, lint and signed App Bundle
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease bundleRelease
      - name: Verify bundle certificate, version and target SDK
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          keytool -printcert -jarfile "$AAB" > cert-info.txt
          actual=$(sed -n 's/^[[:space:]]*SHA256: //p' cert-info.txt | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$MCX_EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$actual" && test "$actual" = "$expected" ||
            { echo "Bundle signing certificate differs from the permanent key: refusing"; exit 1; }
          grep -Eq '^[[:space:]]*targetSdk 3[6-9]' android/app/build.gradle ||
            { echo "Google Play requires targetSdk 36 or newer"; exit 1; }
          mkdir -p play
          cp "$AAB" "play/MeshCrossway-$REQUESTED.aab"
          cp android/app/build/outputs/mapping/release/mapping.txt play/ 2>/dev/null || true
          (cd play && sha256sum *.aab > SHA256SUMS.txt)
          mkdir -p play/whatsnew
          # Play limits release notes to 500 characters per language.
          head -c 500 fastlane/metadata/android/en-US/changelogs/default.txt > play/whatsnew/whatsnew-en-US 2>/dev/null || true
          head -c 500 fastlane/metadata/android/pt-BR/changelogs/default.txt > play/whatsnew/whatsnew-pt-BR 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: MeshCrossway-${{ inputs.version }}-play-bundle
          path: play/
          retention-days: 30
      - name: Upload to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.meshcrossway.mobile
          releaseFiles: play/MeshCrossway-${{ inputs.version }}.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: play/whatsnew
      - name: Remove ephemeral keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/meshcrossway-release.p12"
