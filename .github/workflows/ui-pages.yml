name: Build firmware and deploy MeshCrossway website

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/ui-prototype/**"
      - "docs/images/architecture/modular-ble-topology.svg"
      - "docs/images/meshcrossway_mountain_connectivity_concept.png"
      - "docs/images/meshcrossway-modular-hero.jpg"
      - "firmware/display-prototype/**"
      - "scripts/build_firmware_versions.sh"
      - "scripts/write_firmware_*.py"
      - "scripts/verify_firmware_version.py"
      - "scripts/check_firmware_identity.py"
      - "scripts/restore_reviewed_firmware.py"
      - ".github/workflows/ui-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble website
        run: |
          mkdir -p _site/ui _site/media _site/flasher/firmware
          cp -R docs/site/. _site/
          cp -R docs/ui-prototype/. _site/ui/
          cp docs/images/meshcrossway_mountain_connectivity_concept.png _site/media/
          cp docs/images/meshcrossway-modular-hero.jpg _site/media/
          cp docs/images/architecture/modular-ble-topology.svg _site/media/
      - name: Validate firmware archive scripts
        run: |
          set -euo pipefail
          bash -n scripts/build_firmware_versions.sh
          python3 -m py_compile scripts/write_firmware_version.py scripts/write_firmware_catalog.py scripts/verify_firmware_version.py
      - name: Restore cached current firmware image
        uses: actions/cache@v4
        with:
          path: _site/flasher/firmware/versions
          key: meshcrossway-current-${{ hashFiles('firmware/display-prototype/**', 'scripts/build_firmware_versions.sh', 'scripts/write_firmware_version.py') }}-idf532-bsp-d9ff7837-v2
      - name: Reuse identical firmware approved by PR preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/restore_reviewed_firmware.py
      - name: Compile only supported releases
        run: bash scripts/build_firmware_versions.sh
      - name: Verify selectable manifests and binaries
        run: |
          set -euo pipefail
          python3 scripts/verify_firmware_version.py --dir _site/flasher/firmware/versions/v0.6.2 --version v0.6.2 --ref a508c7d9a9eaf580061d2daca6838ecb78f89085
          python3 scripts/preflight_firmware_catalog.py --catalog _site/flasher/firmware/catalog.json
          python3 scripts/verify_firmware_version.py --dir "_site/flasher/firmware/versions/$(cat firmware/display-prototype/VERSION)" --version "$(cat firmware/display-prototype/VERSION)"
      - name: Verify embedded firmware UI version
        run: python3 scripts/check_firmware_identity.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
