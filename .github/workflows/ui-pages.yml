name: Deploy UI prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/ui-prototype/**"
      - ".github/workflows/ui-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload UI prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/ui-prototype
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
