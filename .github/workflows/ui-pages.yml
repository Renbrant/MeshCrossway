name: Deploy MeshCrossway website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/ui-prototype/**"
      - "docs/images/meshcrossway_mountain_connectivity_concept.png"
      - ".github/workflows/ui-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble website
        run: |
          mkdir -p _site/ui _site/media
          cp -R docs/site/. _site/
          cp -R docs/ui-prototype/. _site/ui/
          cp docs/images/meshcrossway_mountain_connectivity_concept.png _site/media/
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
