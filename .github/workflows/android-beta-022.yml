name: Publish Android 0.2.2 beta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-beta-022.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: android-beta-0.2.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '42667980890'
      SOURCE_SHA: cacd024724e1ea615a710dff75b24f38fe01ad69
      RELEASE_SHA: dbe739d52f6b95586d0e4bd900e04882f5e1ed50
    steps:
      - name: Wait for exact source and Android API 29/35 verification
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
            jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha' run.json
            status=$(jq -r '.status' run.json)
            result=$(jq -r '.conclusion // ""' run.json)
            if [ "$status" = "completed" ]; then
              test "$result" = "success" || { echo "Android tests failed: $result"; exit 1; }
              break
            fi
            echo "Awaiting Android emulator tests: attempt $attempt ($status)"
            sleep 10
          done
          test "$(jq -r '.status' run.json)" = completed || { echo "CI did not complete"; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > jobs.json
          jq -e '[.jobs[] | select(.name == "apk" or .name == "device-smoke (29)" or .name == "device-smoke (35)")] | length == 3 and all(.[]; .conclusion == "success")' jobs.json
          gh api "repos/$GH_REPO/commits/$RELEASE_SHA" > commit.json
          jq -e --arg sha "$RELEASE_SHA" '.sha == $sha' commit.json
      - name: Download exact CI tested Android APK
        uses: actions/download-artifact@v4
        with:
          name: MeshCrossway-Android-0.1.0
          path: release
          run-id: 42667980890
          github-token: ${{ github.token }}
      - name: Publish public prerelease with verified checksum
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          test -s MeshCrossway-0.1.0.apk
          mv MeshCrossway-0.1.0.apk MeshCrossway-0.2.2.apk
          sha256sum MeshCrossway-0.2.2.apk > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          ## MeshCrossway Android 0.2.2 — remote Chats, Channels and visual offline map beta

          This is **public beta software for testing**, not version 1.0.0 or a production remote access service. The phone and computer must be on the same trusted Wi-Fi LAN.

          ### Browser messaging improvements
          - Under **Messages**, switch between Meshtastic (orange) and MeshCore (cyan).
          - Use separate **Chats**, **Channels** and **Nodes** tabs. Chats show private conversation history and unread counts; Channels show configured channels even before their first message, plus saved MeshCore group conversations.
          - Select a messageable node to start a new direct chat, even without prior messages. Disabled channels/nodes cannot be used to send.
          - Select any available chat/channel, read history, send/reply and mark messages as read. Existing per-radio GATT queues and native protocol paths remain authoritative; there is no bridging between Meshtastic and MeshCore.

          ### Visual offline map download
          - On **Offline maps**, pan/zoom the visual map, click **Draw area**, then drag a rectangle. Give it a name and choose maximum offline detail with a slider.
          - Selected rectangle coordinates are computed automatically (no North/South/East/West fields). The app estimates resource counts and enforces the same 2,400-tile / 45-MB per-region constraints as the phone.
          - Saved areas are displayed over the preview, with **Show on map**, pause, resume and delete.
          - **Map preview** uses only OpenStreetMap tiles currently viewed in the computer browser, with attribution. It never downloads those OSM raster tiles for offline storage. The actual offline area is downloaded by the phone via OpenFreeMap/MapLibre under its separate provider limits. Map preview requires internet on the PC; new offline region download requires internet on the phone.
          - Browser location requires explicit permission. It never automatically shares phone GPS data.

          ### Existing security
          - The four-to-eight-digit numeric PIN, local HTTPS server, certificate fingerprint verification, login throttling and browser session protections are unchanged from 0.2.1.
          - Only share the access code with trusted users; do not port-forward the phone's local HTTPS service to the internet.

          ### Validation
          [Android CI run](https://github.com/Renbrant/MeshCrossway/actions/runs/42667980890): build/lint, JavaScript map geometry/HTML checks and Android API 29/35 emulator smoke tests passed, including HTTP login, separate Chats/Channels/Nodes markup and the bundled map selector asset.
          [Source PR #193](https://github.com/Renbrant/MeshCrossway/pull/193).
          Physical acceptance is still required for live radios, direct-message and channel send, map rectangle drawing and downloading a real area.

          ### Install, update and recovery
          Download **MeshCrossway-0.2.2.apk** below (ARM64, Android 8.0+). These APKs use CI development signing keys. If an in-place update fails due to a signature conflict, **export JSON messages and required GPX tracks before uninstalling** any previous build. Uninstalling erases local application data.
          [Previous 0.2.1 beta](https://github.com/Renbrant/MeshCrossway/releases/tag/android-v0.2.1) remains available for recovery.
          SHA-256 is attached as SHA256SUMS.txt.
          NOTES
          if gh release view android-v0.2.2 >/dev/null 2>&1; then
            mkdir previous
            gh release download android-v0.2.2 -p MeshCrossway-0.2.2.apk -D previous
            cmp previous/MeshCrossway-0.2.2.apk MeshCrossway-0.2.2.apk
            echo "Identical 0.2.2 APK already published; no overwrite performed"
          else
            gh release create android-v0.2.2 MeshCrossway-0.2.2.apk SHA256SUMS.txt \
              --target "$RELEASE_SHA" \
              --title "Android 0.2.2 — Remote Chats, Channels & Visual Offline Maps beta" \
              --notes-file release-notes.md --prerelease --latest=false
          fi
