name: Publish Android 0.2.5 compact Home beta (permanent key)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-beta-025.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-beta-0.2.5-permanent
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '42716563284'
      SOURCE_SHA: 'a8f226633bd9e85480358c96a6f72d8bb13832ca'
      RELEASE_SHA: '0f14b3847fb69257c175d854968ad0d57ae1d2a5'
      MCX_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      MCX_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      MCX_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      MCX_EXPECTED_CERT: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
      RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
    steps:
      - name: Require complete CI tests for the exact Android source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > /tmp/verify-run.json
            jq -e --arg expected "$SOURCE_SHA" '.head_sha == $expected' /tmp/verify-run.json
            status=$(jq -r '.status' /tmp/verify-run.json)
            if [ "$status" = completed ]; then
              test "$(jq -r '.conclusion' /tmp/verify-run.json)" = success ||
                { echo "Source CI did not pass; release blocked"; exit 1; }
              break
            fi
            echo "Awaiting Android source tests: attempt $attempt ($status)"
            sleep 10
          done
          test "$(jq -r '.status' /tmp/verify-run.json)" = completed ||
            { echo "Source tests did not finish; release blocked"; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > /tmp/verify-jobs.json
          jq -e '[.jobs[] | select(.name == "apk" or .name == "device-smoke (29)" or .name == "device-smoke (35)")] | length == 3 and all(.[]; .conclusion == "success")' /tmp/verify-jobs.json
          gh api "repos/$GH_REPO/commits/$RELEASE_SHA" > /tmp/release-commit.json
          jq -e --arg sha "$RELEASE_SHA" '.sha == $sha' /tmp/release-commit.json
      - name: Check out exact merged, tested version
        uses: actions/checkout@v4
        with:
          ref: 0f14b3847fb69257c175d854968ad0d57ae1d2a5
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare existing permanent signing key (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionName '0.2.5'" android/app/build.gradle
          grep -Fq 'versionCode 15' android/app/build.gradle
          grep -Fq "applicationId 'com.meshcrossway.mobile'" android/app/build.gradle
          for variable in RELEASE_KEYSTORE_B64 MCX_SIGNING_STORE_PASSWORD MCX_SIGNING_KEY_ALIAS MCX_SIGNING_KEY_PASSWORD MCX_EXPECTED_CERT; do
            test -n "${!variable}" || { echo "Permanent signing secret missing"; exit 1; }
          done
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/meshcrossway-release.p12"
          chmod 600 "$RUNNER_TEMP/meshcrossway-release.p12"
          printf 'MCX_SIGNING_KEYSTORE=%s\n' "$RUNNER_TEMP/meshcrossway-release.p12" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/meshcrossway-release.p12" \
            -storetype PKCS12 -storepass "$MCX_SIGNING_STORE_PASSWORD" >/dev/null
      - name: Build release APK with permanent key
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease lintRelease
      - name: Verify APK signer and immutable version
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apk-cert.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apk-cert.txt | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$MCX_EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$actual" && test "$actual" = "$expected" ||
            { echo "Signing certificate differs from the permanent key; release blocked"; exit 1; }
          "$TOOLS/aapt" dump badging "$APK" | grep -F "versionName='0.2.5'"
          mkdir -p release
          cp "$APK" release/MeshCrossway-0.2.5.apk
          (cd release && sha256sum MeshCrossway-0.2.5.apk > SHA256SUMS.txt)
          printf '%s\n' "$actual" > release/SIGNING-CERT-SHA256.txt
      - name: Publish beta release without ever replacing prior builds
        shell: bash
        run: |
          set -euo pipefail
          if gh release view android-v0.2.5 >/dev/null 2>&1; then
            echo "0.2.5 already published; no APK overwrite allowed"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/android-v0.2.5 >/dev/null 2>&1; then
            echo "0.2.5 tag exists; no overwrite allowed"
            exit 1
          fi
          cat > /tmp/android-025-notes.md <<'NOTES'
          ## MeshCrossway Android 0.2.5 — Compact dual-mesh Home and measured BLE signal

          **Updated Home layout**
          - The two Meshtastic and MeshCore radio cards now appear first, side by side.
          - Removed the duplicate "MT ready · MC ready" strip on Home, the full-width "Dual mesh dashboard" summary and the repeated titles between Nodes, Chats, Channels and Field tools.
          - Reduced card heights/margins and row spacing. Remote Access, GPS, Tracks and navigation remain available lower down.

          **Real BLE signal indicator**
          - Each radio connection card now shows four signal bars and Bluetooth RSSI in dBm, polled from Android's BluetoothGatt callback while the corresponding radio queue is idle.
          - The value measures the PHONE-TO-RADIO BLUETOOTH link, NOT the LoRa network RSSI. A reading is never invented.
          - Last valid RSSI is saved per radio and shown as muted "Last BLE" after disconnect. Missing readings display "BLE signal unavailable".
          - RSSI read failures are nonfatal; the two independent Meshtastic/MeshCore BLE stacks and messaging are unchanged.

          **Safe in-place update**
          This APK is signed with the **same permanent release key as Android 0.2.3 and 0.2.4**, package com.meshcrossway.mobile, versionCode 15. Install **directly over your existing MeshCrossway 0.2.4 APK** to preserve locally saved messages, favorites, radio connections, settings, GPS tracks, photo themes and offline maps. **Do not uninstall or clear app storage.** No ADB, migration or ZIP is needed for ordinary signed updates.

          **Validation:** The exact-source [CI run #42716563284](https://github.com/Renbrant/MeshCrossway/actions/runs/42716563284) passed build/lint and Android API29/35 emulator tests, including BLE-signal mapping and compact Home assertions. [PR #199](https://github.com/Renbrant/MeshCrossway/pull/199). Physical BLE RSSI verification with the user's two radios on a Galaxy S25 remains a beta acceptance test.

          The APK SHA-256 and permanent signing certificate fingerprint are attached as separate files. **Public beta, not a final 1.0 release.**
          NOTES
          gh release create android-v0.2.5 \
            release/MeshCrossway-0.2.5.apk release/SHA256SUMS.txt release/SIGNING-CERT-SHA256.txt \
            --target "$RELEASE_SHA" --title "Android 0.2.5 — Compact Home & real BLE RSSI beta" \
            --notes-file /tmp/android-025-notes.md --prerelease --latest=false
      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/meshcrossway-release.p12"
