name: Deploy cloud Worker

# Deploys cloud/ (Cloudflare Worker meshcrossway-cloud) from main.
# Required repository secret: CLOUDFLARE_API_TOKEN (permission: Workers Scripts: Edit,
# plus D1/R2 access for the bindings declared in cloud/wrangler.toml).
# Optional repository secret: CLOUDFLARE_ACCOUNT_ID (needed only if the token can see
# more than one account).
# D1 migrations are NOT applied here; run `wrangler d1 migrations apply` deliberately.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud/src/**"
      - "cloud/wrangler.toml"
      - "cloud/package.json"
      - "cloud/package-lock.json"
      - "cloud/tsconfig.json"
      - "scripts/test_cloud_retention_cutoff.py"
      - ".github/workflows/cloud-deploy.yml"

permissions:
  contents: read

concurrency:
  group: cloud-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Retention cutoff regression test
        working-directory: .
        run: python3 -I scripts/test_cloud_retention_cutoff.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Bundle dry run
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry-run"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (or has a different name)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          npx wrangler deploy
