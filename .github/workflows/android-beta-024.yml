name: Publish Android 0.2.4 appearance beta (permanent key)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-beta-024.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-beta-0.2.4-permanent
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '42688006484'
      SOURCE_SHA: '4f3fe5412c272cbfdc5698fdbf90e199e5476cf0'
      RELEASE_SHA: 'aa703e05d97842272e35b4d872f72024b68ef531'
      MCX_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      MCX_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      MCX_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      MCX_EXPECTED_CERT: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
      RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
    steps:
      - name: Require complete CI tests for the exact Android source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > /tmp/verify-run.json
            jq -e --arg expected "$SOURCE_SHA" '.head_sha == $expected' /tmp/verify-run.json
            status=$(jq -r '.status' /tmp/verify-run.json)
            if [ "$status" = completed ]; then
              test "$(jq -r '.conclusion' /tmp/verify-run.json)" = success ||
                { echo "Source CI did not pass; release blocked"; exit 1; }
              break
            fi
            echo "Awaiting Android source tests: attempt $attempt ($status)"
            sleep 10
          done
          test "$(jq -r '.status' /tmp/verify-run.json)" = completed ||
            { echo "Source tests did not finish; release blocked"; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > /tmp/verify-jobs.json
          jq -e '[.jobs[] | select(.name == "apk" or .name == "device-smoke (29)" or .name == "device-smoke (35)")] | length == 3 and all(.[]; .conclusion == "success")' /tmp/verify-jobs.json
          gh api "repos/$GH_REPO/commits/$RELEASE_SHA" > /tmp/release-commit.json
          jq -e --arg sha "$RELEASE_SHA" '.sha == $sha' /tmp/release-commit.json
      - name: Check out exact merged, tested version
        uses: actions/checkout@v4
        with:
          ref: aa703e05d97842272e35b4d872f72024b68ef531
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare existing permanent signing key (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionName '0.2.4'" android/app/build.gradle
          grep -Fq 'versionCode 14' android/app/build.gradle
          grep -Fq "applicationId 'com.meshcrossway.mobile'" android/app/build.gradle
          for variable in RELEASE_KEYSTORE_B64 MCX_SIGNING_STORE_PASSWORD MCX_SIGNING_KEY_ALIAS MCX_SIGNING_KEY_PASSWORD MCX_EXPECTED_CERT; do
            test -n "${!variable}" || { echo "Permanent signing secret missing"; exit 1; }
          done
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/meshcrossway-release.p12"
          chmod 600 "$RUNNER_TEMP/meshcrossway-release.p12"
          printf 'MCX_SIGNING_KEYSTORE=%s\n' "$RUNNER_TEMP/meshcrossway-release.p12" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/meshcrossway-release.p12" \
            -storetype PKCS12 -storepass "$MCX_SIGNING_STORE_PASSWORD" >/dev/null
      - name: Build release APK with permanent key
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease lintRelease
      - name: Verify APK signer and immutable version
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apk-cert.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apk-cert.txt | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$MCX_EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$actual" && test "$actual" = "$expected" ||
            { echo "Signing certificate differs from the permanent key; release blocked"; exit 1; }
          "$TOOLS/aapt" dump badging "$APK" | grep -F "versionName='0.2.4'"
          mkdir -p release
          cp "$APK" release/MeshCrossway-0.2.4.apk
          (cd release && sha256sum MeshCrossway-0.2.4.apk > SHA256SUMS.txt)
          printf '%s\n' "$actual" > release/SIGNING-CERT-SHA256.txt
      - name: Publish beta release without ever replacing prior builds
        shell: bash
        run: |
          set -euo pipefail
          if gh release view android-v0.2.4 >/dev/null 2>&1; then
            echo "0.2.4 already published; no APK overwrite allowed"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/android-v0.2.4 >/dev/null 2>&1; then
            echo "0.2.4 tag exists; no overwrite allowed"
            exit 1
          fi
          cat > /tmp/android-024-notes.md <<'NOTES'
          ## MeshCrossway Android 0.2.4 — Appearance themes beta
          
          **New: Settings → Appearance & colors** lets you choose:
          
          - **System**: follow Android light/dark appearance
          - **Color**: solid color with adjustable hue and color swatches
          - **Gradient**: adjustable linear or mesh gradient backgrounds
          - **Photo**: choose a photo on the phone, adjust dim and blur. The app stores a local, re-encoded, EXIF-stripped private copy; no upload is made.
          
          Theme preferences and the private photo remain saved in the same app storage and survive normal in-place Android APK updates. The remote computer/browser UI has its own separate visual appearance at present.
          
          **Important:** This APK is signed with the EXACT same long-lived signing key and same app package as Android 0.2.3 (versionCode 14). To preserve messages, saved radios, favorites, track recordings and downloaded offline maps, install it **over** your existing 0.2.3 app; do **not** uninstall, clear app data or install a debug-signed APK.
          
          Meshtastic radio identity remains orange and MeshCore remains blue. The existing independent dual BLE messaging, optional HTTPS browser workspace, offline maps and tracks are unchanged by this theme update.
          
          The app's portable full ZIP backup stores theme preferences but not a custom background photo image; a full uninstall would remove the latter. Re-select the photo after a fresh reinstall if necessary.
          
          **Validation:** [Android source CI run](https://github.com/Renbrant/MeshCrossway/actions/runs/42688006484) passed build/lint and Android API 29/35 emulator smoke tests including persistent appearance settings and photo loading. See [PR #197](https://github.com/Renbrant/MeshCrossway/pull/197). Real phone visual checks of all four themes remain required. **Public beta, not production version 1.0.**
          
          APK SHA-256 and permanent certificate fingerprint are attached separately.
          NOTES
          gh release create android-v0.2.4 \
            release/MeshCrossway-0.2.4.apk release/SHA256SUMS.txt release/SIGNING-CERT-SHA256.txt \
            --target "$RELEASE_SHA" --title "Android 0.2.4 — Custom color, gradient & photo themes beta" \
            --notes-file /tmp/android-024-notes.md --prerelease --latest=false
      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/meshcrossway-release.p12"
