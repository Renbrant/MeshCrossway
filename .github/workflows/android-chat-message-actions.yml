name: Validate Android source on main

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/test_android_**'
      - '.github/workflows/android-chat-message-actions.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/test_android_**'
      - '.github/workflows/android-chat-message-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Protocol and local browser fixture tests
        run: |
          bash scripts/test_android_probe.sh
          node scripts/test_android_remote_web.cjs
      - name: Unit tests, debug build and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
