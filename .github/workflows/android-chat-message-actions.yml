name: Validate Android chat message actions

on:
  push:
    branches:
      - baseline/android-0.1.0
    paths:
      - 'android/app/src/main/java/com/meshcrossway/android/MainActivity.java'
      - 'android/app/src/main/java/com/meshcrossway/android/MessageActions.java'
      - 'android/app/src/test/java/com/meshcrossway/android/MessageActionsTest.java'
      - 'android/app/build.gradle'
      - '.github/workflows/android-chat-message-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, debug build and lint (no APK publication)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
