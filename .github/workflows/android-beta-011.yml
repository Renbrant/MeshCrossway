name: Publish Android 0.1.1 beta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-beta-011.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: android-beta-0.1.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '42632459274'
      SOURCE_SHA: b6da56fe01e323e16bc4830a3be45e678923aa24
      RELEASE_SHA: 57a982208cfc807f19e8ddead0f2017671755aad
    steps:
      - name: Verify validated source and all Android tests
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .conclusion == "success"' run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > jobs.json
          jq -e '[.jobs[] | select(.name == "apk" or .name == "device-smoke (29)" or .name == "device-smoke (35)")] | length == 3 and all(.[]; .conclusion == "success")' jobs.json
          gh api "repos/$GH_REPO/commits/$RELEASE_SHA" > commit.json
          jq -e --arg sha "$RELEASE_SHA" '.sha == $sha' commit.json
      - name: Download exact CI APK
        uses: actions/download-artifact@v4
        with:
          name: MeshCrossway-Android-0.1.0
          path: release
          run-id: 42632459274
          github-token: ${{ github.token }}
      - name: Publish immutable public prerelease
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          test -s MeshCrossway-0.1.0.apk
          mv MeshCrossway-0.1.0.apk MeshCrossway-0.1.1.apk
          sha256sum MeshCrossway-0.1.1.apk > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          ## MeshCrossway Android 0.1.1 — public beta
          Small UI update based on the Cairn-style dashboard request. Side-by-side Meshtastic (orange) and MeshCore (cyan) cards show BLE status, node counts, unread chats, previews and channel counts. Shared phone GPS, tracks and unified map shortcuts remain accessible. Tapping network cards opens the corresponding filtered screen.

          No Bluetooth protocol, radio service or database migration changes. Both radios remain fully independent and there is no cross-network forwarding.

          ### Tested
          APK build, lint, protocol fixtures and Android API 29 / API 35 instrumented smoke tests passed:
          https://github.com/Renbrant/MeshCrossway/actions/runs/42632459274
          The new dashboard still needs on-device usability acceptance with physical radios. This is beta software, **not version 1.0.0**.

          ### Install
          Download MeshCrossway-0.1.1.apk below on an ARM64 Android 8+ phone. This APK uses the GitHub CI signing certificate; if Android rejects an in-place upgrade from a differently signed build, first export JSON message history and saved GPX tracks. Uninstalling removes private app data.

          The previous 0.1.0 prerelease remains available as a recovery build. See SHA256SUMS.txt for the new APK checksum.

          Source PR: https://github.com/Renbrant/MeshCrossway/pull/190
          Merged Android source: 57a982208cfc807f19e8ddead0f2017671755aad
          NOTES
          if gh release view android-v0.1.1 >/dev/null 2>&1; then
            mkdir previous
            gh release download android-v0.1.1 -p MeshCrossway-0.1.1.apk -D previous
            cmp previous/MeshCrossway-0.1.1.apk MeshCrossway-0.1.1.apk
            echo "Identical prerelease already published."
          else
            gh release create android-v0.1.1 MeshCrossway-0.1.1.apk SHA256SUMS.txt \
              --target "$RELEASE_SHA" \
              --title "Android 0.1.1 — Dual-network Home beta" \
              --notes-file release-notes.md --prerelease --latest=false
          fi
