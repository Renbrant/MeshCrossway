name: Verify public offline map source
on:
  pull_request:
    paths: ['.github/workflows/map-source-probe.yml']
permissions: { contents: read }
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify provider PNG and public FAQ
        run: |
          python3 - <<'PY'
          import urllib.request,struct,hashlib
          for url in ['https://tiles.coalition.space/raster/styles/osm-bright/14/3069/6213.png','https://download.tiles.coalition.space/faq']:
            request=urllib.request.Request(url,headers={'User-Agent':'MeshCrossway/0.10.5 (+https://github.com/Renbrant/MeshCrossway)'})
            with urllib.request.urlopen(request,timeout=30) as r:
              data=r.read(2000000)
              print(url,r.status,r.headers.get('Content-Type'),len(data))
              if url.endswith('.png'):
                assert data[:8]==b'\x89PNG\r\n\x1a\n'
                assert struct.unpack('>II',data[16:24])==(256,256)
                print('Verified 256x256 PNG',hashlib.sha256(data).hexdigest())
          PY
