name: Android permanent-key release
on:
  push:
    branches: [baseline/android-0.1.0]
    paths:
      - '.github/workflows/android-permanent-release.yml'
      - 'android/app/build.gradle'
      - 'android/app/src/main/**'
      - 'android/app/src/test/**'
      - 'android/app/src/androidTest/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match android/app/build.gradle)'
        required: true
        default: '0.3.3'
        type: string
permissions:
  contents: write
concurrency:
  group: android-permanent-release
  cancel-in-progress: false
jobs:
  meshtastic-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build storage instrumentation
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify data migration and reply/node persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e mtOnly true com.meshcrossway.mobile.test/com.meshcrossway.android.SmokeInstrumentation > mt-storage-result.txt
            cat mt-storage-result.txt
            grep -F 'OK (1 test)' mt-storage-result.txt
  release:
    needs: meshtastic-storage
    if: github.ref == 'refs/heads/baseline/android-0.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ORG_GRADLE_PROJECT_clerkPublishableKey: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      ORG_GRADLE_PROJECT_cloudApiBaseUrl: ${{ vars.CLOUD_API_BASE_URL || 'https://meshcrossway-cloud.meshcrossway.workers.dev' }}
      MCX_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      MCX_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      MCX_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      MCX_EXPECTED_CERT: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
      RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify requested version and permanent signing credentials
        shell: bash
        env:
          REQUESTED: ${{ inputs.version || '0.3.3' }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED" =~ ^0\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          grep -Fq "versionName '$REQUESTED'" android/app/build.gradle ||
            { echo "The requested version does not match source code"; exit 1; }
          for name in RELEASE_KEYSTORE_B64 MCX_SIGNING_STORE_PASSWORD MCX_SIGNING_KEY_ALIAS MCX_SIGNING_KEY_PASSWORD MCX_EXPECTED_CERT; do
            if [ -z "${!name}" ]; then
              echo "Missing permanent signing GitHub secret $name. Do not publish another disposable debug key."
              exit 1
            fi
          done
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/meshcrossway-release.p12"
          chmod 600 "$RUNNER_TEMP/meshcrossway-release.p12"
          printf 'MCX_SIGNING_KEYSTORE=%s\n' "$RUNNER_TEMP/meshcrossway-release.p12" >> "$GITHUB_ENV"
          # The secret itself is never echoed or uploaded.
          keytool -list -keystore "$RUNNER_TEMP/meshcrossway-release.p12" \
            -storetype PKCS12 -storepass "$MCX_SIGNING_STORE_PASSWORD" >/dev/null
      - name: Protocol and browser fixture checks
        run: |
          bash scripts/test_android_probe.sh
          node scripts/test_android_remote_web.cjs
          python3 scripts/test_android_migration.py
      - name: Build permanent-key signed release and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease lintRelease
      - name: Verify APK signature identity and version before publishing
        shell: bash
        env:
          REQUESTED: ${{ inputs.version || '0.3.3' }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > cert-info.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' cert-info.txt | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$MCX_EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$actual" && test "$actual" = "$expected" ||
            { echo "Release signing certificate changed: refusing to publish"; exit 1; }
          "$TOOLS/aapt" dump badging "$APK" | grep -F "versionName='$REQUESTED'"
          mkdir -p release
          cp "$APK" "release/MeshCrossway-$REQUESTED.apk"
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' "$actual" > release/SIGNING-CERT-SHA256.txt
          echo "Signed release identity matches the long-lived certificate."
      - name: Publish only if no version tag or release exists
        shell: bash
        env:
          REQUESTED: ${{ inputs.version || '0.3.3' }}
        run: |
          set -euo pipefail
          TAG="android-v$REQUESTED"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version already published; never overwrite an APK/certificate"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to overwrite"
            exit 1
          fi
          cat > release-notes.md <<EOF
          ## MeshCrossway Android $REQUESTED — Meshtastic settings beta

          **Install as an update:** install this APK over Android 0.2.9 and choose Update. The permanent signing certificate is unchanged. Do not uninstall the app or clear its storage; that would remove locally saved messages, favorites, settings, tracks and offline maps.

          **Meshtastic corrections:** explicit preset IDs; correlated administrative GET/ACK/readback; expiring-session refresh; empty-default configuration handling; firmware and hardware gates; staged LoRa changes with manual parameters; licensed callsign onboarding; channel-name/key identity reconciliation; structured replies/reactions; persisted node metadata and telemetry samples; neighbor information and requested traceroute. A Bluetooth write is never presented as a confirmed settings save. Reconnection verifies pending changes without automatically resending them.

          **Licensed DM correction:** do not request PKI encryption when either participant is licensed, including before opening User settings; clear stale public keys when the radio removes them.

          **Compatibility:** install over 0.3.1/0.3.2 using Update. Full official-app feature parity, remote administration/shell, firmware updates and every module editor are not included. Hardware/RF validation is still required.

          Existing local app data and features remain available after an in-place update. The long-lived signing certificate is verified by CI and its SHA-256 fingerprint is attached to this release. This is a public beta, not version 1.0.
          EOF
          gh release create "$TAG" "release/MeshCrossway-$REQUESTED.apk" \
             release/SHA256SUMS.txt release/SIGNING-CERT-SHA256.txt \
             --target "$GITHUB_SHA" \
             --title "Android $REQUESTED — Meshtastic settings beta" \
             --notes-file release-notes.md --prerelease --latest=false
      - name: Remove ephemeral keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/meshcrossway-release.p12"
