name: Android alpha APK
on:
  pull_request:
    paths: ['android/**', 'scripts/test_android_probe.sh', 'scripts/test_android_device.sh', 'scripts/test_android_remote_web.cjs', 'scripts/test_android_migration.py', 'scripts/migrate_android_debug_install.py', '.github/workflows/android-apk.yml']
  push:
    branches: [main]
    paths: ['android/**', 'scripts/test_android_probe.sh', 'scripts/test_android_device.sh', 'scripts/test_android_remote_web.cjs', 'scripts/test_android_migration.py', 'scripts/migrate_android_debug_install.py', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORG_GRADLE_PROJECT_clerkPublishableKey: ${{ vars.CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Protocol wire fixtures
        run: bash scripts/test_android_probe.sh
      - name: Browser chats and map selector unit tests
        run: node scripts/test_android_remote_web.cjs
      - name: Complete backup migration fixture tests
        run: python3 scripts/test_android_migration.py
      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Package test APK
        run: |
          mkdir -p android-artifact
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk android-artifact/MeshCrossway-0.1.0.apk
          cd android-artifact
          sha256sum MeshCrossway-0.1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MeshCrossway-Android-0.1.0
          path: android-artifact/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  device-smoke:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/test_android_device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-smoke-report-${{ matrix.api }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-ui-${{ matrix.api }}
          path: android-device-screenshots/
          if-no-files-found: ignore
