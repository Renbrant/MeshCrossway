name: Android alpha APK
on:
  pull_request:
    paths: ['android/**', 'scripts/test_android_probe.sh', '.github/workflows/android-apk.yml']
  push:
    branches: [main, feat/android-dual-radio-alpha]
    paths: ['android/**', 'scripts/test_android_probe.sh', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Protocol wire fixtures
        run: bash scripts/test_android_probe.sh
      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Package test APK
        run: |
          mkdir -p android-artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk android-artifact/MeshCrossway-0.1.0-alpha01.apk
          cd android-artifact
          sha256sum MeshCrossway-0.1.0-alpha01.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MeshCrossway-Android-0.1.0-alpha01
          path: android-artifact/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
