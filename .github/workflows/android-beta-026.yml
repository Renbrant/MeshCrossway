name: Android 0.2.6 beta - permanent-key release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-beta-026.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-v026-permanent-release
  cancel-in-progress: false

jobs:
  device-smoke:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/test_android_device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-026-device-smoke-${{ matrix.api }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
  signed-beta:
    needs: device-smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      MCX_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      MCX_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      MCX_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      MCX_EXPECTED_CERT: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
      RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preflight version, tag and permanent-signing configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId 'com.meshcrossway.mobile'" android/app/build.gradle
          grep -Fq "versionCode 16" android/app/build.gradle
          grep -Fq "versionName '0.2.6'" android/app/build.gradle
          if gh release view android-v0.2.6 >/dev/null 2>&1; then
            echo 'Release already exists, cannot overwrite an installed beta'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/android-v0.2.6 >/dev/null 2>&1; then
            echo 'Tag already exists, refusing to overwrite'
            exit 1
          fi
          for name in RELEASE_KEYSTORE_B64 MCX_SIGNING_STORE_PASSWORD MCX_SIGNING_KEY_ALIAS MCX_SIGNING_KEY_PASSWORD MCX_EXPECTED_CERT; do
            test -n "${!name}" || { echo "Missing permanent signing secret $name"; exit 1; }
          done
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/meshcrossway-release.p12"
          chmod 600 "$RUNNER_TEMP/meshcrossway-release.p12"
          printf 'MCX_SIGNING_KEYSTORE=%s\n' "$RUNNER_TEMP/meshcrossway-release.p12" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/meshcrossway-release.p12" -storetype PKCS12 -storepass "$MCX_SIGNING_STORE_PASSWORD" >/dev/null
      - name: Regression and protocol/browser fixture tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test_android_probe.sh
          node scripts/test_android_remote_web.cjs
          python3 scripts/test_android_migration.py
      - name: Run Android unit tests, lint and build signed beta
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease lintRelease
      - name: Verify signed APK identity, version and integrity
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-arm64-v8a-release.apk'
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$MCX_EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$actual" && test "$actual" = "$expected" || { echo 'Permanent signing certificate mismatch'; exit 1; }
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.meshcrossway.mobile' versionCode='16' versionName='0.2.6'"
          mkdir -p release
          cp "$APK" release/MeshCrossway-0.2.6.apk
          (cd release && sha256sum MeshCrossway-0.2.6.apk > SHA256SUMS.txt)
          printf '%s\n' "$actual" > release/SIGNING-CERT-SHA256.txt
      - name: Publish immutable signed Android 0.2.6 beta
        shell: bash
        run: |
          set -euo pipefail
          test ! -z "$GITHUB_SHA"
          if gh release view android-v0.2.6 >/dev/null 2>&1; then
            echo 'Refusing to replace existing release'; exit 1
          fi
          gh release create android-v0.2.6 \
            release/MeshCrossway-0.2.6.apk release/SHA256SUMS.txt release/SIGNING-CERT-SHA256.txt \
            --target "$GITHUB_SHA" \
            --title 'Android 0.2.6 - Chat actions and official icon (beta)' \
            --notes-file docs/android-release-026.md --prerelease --latest=false
      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/meshcrossway-release.p12"
