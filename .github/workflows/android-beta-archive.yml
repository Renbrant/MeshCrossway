name: Publish Android 0.1.0 beta archive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-beta-archive.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: android-beta-archive-0.1.0
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '42560950710'
      SOURCE_SHA: ae80e8dbcf2909f13c721e2cb71785056df1d0ce
      APK_SHA256: 7bce895a57265a941ad8c72ef1581a8d786063b5552f5a35a4a2b274eded3851
    steps:
      - name: Verify accepted source and successful validation
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .conclusion == "success"' run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > jobs.json
          jq -e '[.jobs[] | select(.name == "apk" or .name == "device-smoke (29)" or .name == "device-smoke (35)")] | length == 3 and all(.[]; .conclusion == "success")' jobs.json
      - name: Download exact beta APK
        uses: actions/download-artifact@v4
        with:
          name: MeshCrossway-Android-0.1.0
          path: beta
          run-id: 42560950710
          github-token: ${{ github.token }}
      - name: Verify checksum and preserve as public prerelease
        working-directory: beta
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  MeshCrossway-0.1.0.apk\n' "$APK_SHA256" | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          ## Android 0.1.0 — public beta for testing
          This is a development beta, not version 1.0.0 or a production release.
          The functional alpha07 baseline has been accepted in device use; 0.1.0 changes its public version number without adding features.

          Connect one compatible Meshtastic radio and one MeshCore radio independently over Bluetooth. Includes messaging, contacts, map side controls and lower panels, optional node clustering, tracks, POIs, offline areas and available reception metadata. Complete historical paths are available only where captured; see the Android guide.

          ### Install and test
          Download MeshCrossway-0.1.0.apk below (ARM64, Android 8.0+). Allow APK installation for your browser/file manager when prompted. No GitHub Actions login is needed for these public release assets.
          If Android reports a signing conflict with an earlier development build, export JSON history and required GPX tracks before uninstalling it. Uninstalling removes app data. This APK uses a CI debug signature.

          Validate your own phone/radio combination. Report the phone model, Android version, app version, radio firmware and reproduction steps in a GitHub issue; redact private messages, keys and precise locations.

          ### Version strategy
          0.1.1, 0.1.2, etc. are fixes and small improvements. 0.2.0 and later minor increments are substantial changes. 1.0.0 will mark the first production release after core scope and stability acceptance. Controller firmware keeps its own version sequence.

          Source: ae80e8dbcf2909f13c721e2cb71785056df1d0ce
          Validation: https://github.com/Renbrant/MeshCrossway/actions/runs/42560950710 — APK/lint/JVM checks and API 29 / API 35 device smoke tests passed.
          APK SHA-256: 7bce895a57265a941ad8c72ef1581a8d786063b5552f5a35a4a2b274eded3851
          NOTES
          if gh release view android-v0.1.0 >/dev/null 2>&1; then
            mkdir existing
            gh release download android-v0.1.0 -p MeshCrossway-0.1.0.apk -D existing
            printf '%s  existing/MeshCrossway-0.1.0.apk\n' "$APK_SHA256" | sha256sum -c -
          else
            gh release create android-v0.1.0 MeshCrossway-0.1.0.apk SHA256SUMS.txt --target "$SOURCE_SHA" --title "Android 0.1.0 — Beta for testing" --notes-file release-notes.md --prerelease --latest=false
          fi
