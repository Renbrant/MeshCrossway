plugins { id 'com.android.application' }
android {
    namespace 'com.meshcrossway.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.meshcrossway.android'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-alpha02'
        testInstrumentationRunner 'com.meshcrossway.android.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
