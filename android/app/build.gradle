plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.meshcrossway.android'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.meshcrossway.mobile'
        minSdk 26
        targetSdk 35
        versionCode 35
        versionName '0.4.1'
        buildConfigField 'String', 'CLERK_PUBLISHABLE_KEY', '"' + (providers.gradleProperty('clerkPublishableKey').getOrElse('')) + '"'
        buildConfigField 'String', 'CLOUD_API_BASE_URL', '"' + (providers.gradleProperty('cloudApiBaseUrl').getOrElse('https://meshcrossway-cloud.meshcrossway.workers.dev')) + '"'
        testInstrumentationRunner 'com.meshcrossway.android.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    packaging {
        jniLibs { useLegacyPackaging true }
        resources { excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF' }
    }
    lint { abortOnError true }
    buildFeatures { buildConfig true }
    // All published releases MUST use the same long-lived signing certificate.
    // Keystore and passwords are injected by CI secrets; never commit them.
    signingConfigs {
        permanent {
            def keystorePath = System.getenv('MCX_SIGNING_KEYSTORE')
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv('MCX_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('MCX_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('MCX_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // If no keystore is configured, the APK is unsigned and must NOT
            // be published. The release workflow fails closed before building.
            if (System.getenv('MCX_SIGNING_KEYSTORE')) {
                signingConfig signingConfigs.permanent
            }
        }
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.clerk:clerk-android-api:1.4.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.maplibre.gl:android-sdk:11.13.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio-jvm:3.6.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation 'junit:junit:4.13.2'
}
