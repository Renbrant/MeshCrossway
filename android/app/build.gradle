plugins { id 'com.android.application' }
android {
    namespace 'com.meshcrossway.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.meshcrossway.mobile'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.1.1'
        testInstrumentationRunner 'com.meshcrossway.android.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    packaging { jniLibs { useLegacyPackaging true } }
    lint { abortOnError true }
}

dependencies {
    implementation 'org.maplibre.gl:android-sdk:11.13.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio-jvm:3.6.0'
}
