plugins { id 'com.android.application' }
android {
    namespace 'com.meshcrossway.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.meshcrossway.mobile'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-alpha03'
        testInstrumentationRunner 'com.meshcrossway.android.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    packaging { jniLibs { useLegacyPackaging true } }
    lint { abortOnError true }
}

dependencies { implementation 'org.maplibre.gl:android-sdk:11.13.5' }
