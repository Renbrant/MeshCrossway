<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
<title id="title">MeshCrossway | Standalone bench prototype</title><desc id="desc">Waveshare touch controller + two LoRa V3 radios + u-blox GNSS. Proposed hardware; not a working product photograph.</desc>
<rect width="1280" height="780" fill="#f3f6fa"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<text x="40" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#182b42" font-weight="700" text-anchor="start">MeshCrossway | Standalone bench prototype</text>
<text x="40" y="82" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#53657a" font-weight="400" text-anchor="start">Waveshare touch controller + two LoRa V3 radios + u-blox GNSS. Proposed hardware; not a working product photograph.</text>
<rect x="40" y="120" width="520" height="380" rx="16" fill="white" stroke="#ced8e4" stroke-width="2"/>
<path d="M56 120H544Q560 120 560 136V172H40V136Q40 120 56 120" fill="#1768b5"/>
<text x="60" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="white" font-weight="700" text-anchor="start">Waveshare ESP32-S3-Touch-LCD-3.5</text>
<rect x="75" y="195" width="450" height="160" rx="12" fill="#182b42"/>
<text x="105" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="white" font-weight="700" text-anchor="start">MeshCrossway</text>
<text x="105" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#91e4ef" font-weight="400" text-anchor="start">Meshtastic  |  MeshCore</text>
<text x="105" y="320" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="white" font-weight="400" text-anchor="start">Touch UI + queues + local history</text>
<text x="75" y="402" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="400" text-anchor="start">3.5 inch touch | 8 MB PSRAM | 16 MB flash</text>
<text x="75" y="447" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#182b42" font-weight="400" text-anchor="start">Onboard microSD slot | independent USB power</text>
<rect x="720" y="120" width="520" height="170" rx="16" fill="white" stroke="#ced8e4" stroke-width="2"/>
<path d="M736 120H1224Q1240 120 1240 136V172H720V136Q720 120 736 120" fill="#1768b5"/>
<text x="740" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="white" font-weight="700" text-anchor="start">LoRa V3 A | Meshtastic</text>
<text x="745" y="211" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="400" text-anchor="start">ESP32-S3 + SX1262 + OLED + USB-C</text>
<text x="745" y="251" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#182b42" font-weight="400" text-anchor="start">UART PROTO on configured RX4 / TX5</text>
<path d="M560 230L720 230" fill="none" stroke="#1768b5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="720" y="330" width="520" height="170" rx="16" fill="white" stroke="#ced8e4" stroke-width="2"/>
<path d="M736 330H1224Q1240 330 1240 346V382H720V346Q720 330 736 330" fill="#8553b5"/>
<text x="740" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="white" font-weight="700" text-anchor="start">LoRa V3 B | MeshCore</text>
<text x="745" y="421" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="400" text-anchor="start">ESP32-S3 + SX1262 + OLED + USB-C</text>
<text x="745" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#182b42" font-weight="400" text-anchor="start">Companion UART build: RX4 / TX5</text>
<path d="M560 440L720 440" fill="none" stroke="#8553b5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="550" width="520" height="150" rx="16" fill="white" stroke="#ced8e4" stroke-width="2"/>
<path d="M56 550H544Q560 550 560 566V602H40V566Q40 550 56 550" fill="#087f68"/>
<text x="60" y="584" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="white" font-weight="700" text-anchor="start">u-blox GNSS | SparkFun SAM-M10Q</text>
<text x="65" y="640" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="400" text-anchor="start">Position + fix validity | Qwiic I2C | 3.3 V</text>
<path d="M300 550L300 500" fill="none" stroke="#087f68" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="720" y="550" width="520" height="150" rx="16" fill="white" stroke="#ced8e4" stroke-width="2"/>
<path d="M736 550H1224Q1240 550 1240 566V602H720V566Q720 550 736 550" fill="#596775"/>
<text x="740" y="584" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="white" font-weight="700" text-anchor="start">Purchases and integration</text>
<text x="745" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#182b42" font-weight="400" text-anchor="start">One Aideepen two-pack supplies A and B.</text>
<text x="745" y="666" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#182b42" font-weight="400" text-anchor="start">No separate radio base or IO adapters.</text>
<text x="40" y="746" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#53657a" font-weight="400" text-anchor="start">The seller board revision, GPIO routing and header assembly must be checked. The UI simulator uses demo data.</text>
</svg>