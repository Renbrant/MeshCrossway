<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">MeshCrossway modular BLE architecture</title><desc id="d">One display Core and two independently powered detachable LoRa Pods, connected through two Bluetooth LE links.</desc><rect width="1200" height="660" rx="30" fill="#101215"/><text x="600" y="66" text-anchor="middle" fill="#f0f0f0" font-family="Arial,sans-serif" font-size="35" font-weight="bold">MeshCrossway | Modular BLE Architecture</text><text x="600" y="102" text-anchor="middle" fill="#acb0b5" font-family="Arial,sans-serif" font-size="19">THREE INDEPENDENT DEVICES · TWO LORA NETWORKS · ONE UI</text><rect x="395" y="137" width="410" height="194" rx="23" fill="#22262a" stroke="#f27a21" stroke-width="4"/><text x="600" y="181" text-anchor="middle" fill="#ff8b30" font-family="Arial,sans-serif" font-size="29" font-weight="bold">MeshCrossway Core</text><text x="600" y="222" text-anchor="middle" fill="#efefef" font-family="Arial,sans-serif" font-size="21">Waveshare ESP32-S3 · Touch UI</text><text x="600" y="251" text-anchor="middle" fill="#c9ccd0" font-family="Arial,sans-serif" font-size="19">GNSS · microSD · BLE Central</text><text x="600" y="282" text-anchor="middle" fill="#c9ccd0" font-family="Arial,sans-serif" font-size="18">Independent battery</text><path d="M510 331 L340 407" stroke="#ef802b" stroke-width="5" stroke-dasharray="12 9" fill="none"/><path d="M690 331 L860 407" stroke="#9da3aa" stroke-width="5" stroke-dasharray="12 9" fill="none"/><text x="402" y="355" text-anchor="middle" fill="#ff9c4d" font-family="Arial,sans-serif" font-size="20">BLE / PhoneAPI</text><text x="813" y="355" text-anchor="middle" fill="#bbc0c7" font-family="Arial,sans-serif" font-size="20">BLE / Companion</text><rect x="96" y="410" width="465" height="192" rx="22" fill="#22262a" stroke="#f27a21" stroke-width="4"/><rect x="639" y="410" width="465" height="192" rx="22" fill="#22262a" stroke="#9198a1" stroke-width="4"/><text x="329" y="457" text-anchor="middle" fill="#ff8b30" font-family="Arial,sans-serif" font-size="29" font-weight="bold">MX-M Radio Pod</text><text x="871" y="457" text-anchor="middle" fill="#c9ced3" font-family="Arial,sans-serif" font-size="29" font-weight="bold">MX-C Radio Pod</text><text x="329" y="497" text-anchor="middle" fill="#f1f1f1" font-family="Arial,sans-serif" font-size="22">Meshtastic</text><text x="871" y="497" text-anchor="middle" fill="#f1f1f1" font-family="Arial,sans-serif" font-size="22">MeshCore Companion</text><text x="329" y="530" text-anchor="middle" fill="#c9ccd0" font-family="Arial,sans-serif" font-size="19">XIAO ESP32-S3 + Wio-SX1262</text><text x="871" y="530" text-anchor="middle" fill="#c9ccd0" font-family="Arial,sans-serif" font-size="19">XIAO ESP32-S3 + Wio-SX1262</text><text x="329" y="564" text-anchor="middle" fill="#c9ccd0" font-family="Arial,sans-serif" font-size="18">Independent battery + antenna</text><text x="871" y="564" text-anchor="middle" fill="#c9ccd0" font-family="Arial,sans-serif" font-size="18">Independent battery + antenna</text><text x="600" y="636" text-anchor="middle" fill="#aab0b8" font-family="Arial,sans-serif" font-size="17">Software-first · BLE even while mechanically docked · PCB development deferred</text></svg>