<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0b1525"/><text x="55" y="76" fill="#f8fafc" font-family="Arial" font-size="35" font-weight="bold">MeshCrossway V1 | Dual XIAO / Wio-SX1262</text><text x="55" y="111" fill="#94a3b8" font-family="Arial" font-size="19">V1 hardware configuration and provisional UART map — verify target firmware, physical pinout and 3.3 V power before fabrication</text><rect x="60" y="185" width="425" height="355" rx="22" fill="#172940" stroke="#38bdf8" stroke-width="3"/><text x="86" y="236" fill="#ffffff" font-family="Arial" font-size="27" font-weight="bold">Waveshare ESP32-S3</text><text x="86" y="269" fill="#a8d5ed" font-family="Arial" font-size="19">3.5-inch touchscreen / host</text><text x="86" y="332" fill="#e2e8f0" font-family="Arial" font-size="22">UART1 TX: GPIO39</text><text x="86" y="365" fill="#e2e8f0" font-family="Arial" font-size="22">UART1 RX: GPIO40</text><text x="86" y="430" fill="#e2e8f0" font-family="Arial" font-size="22">UART2 TX: GPIO17</text><text x="86" y="463" fill="#e2e8f0" font-family="Arial" font-size="22">UART2 RX: GPIO18</text><rect x="765" y="170" width="455" height="185" rx="22" fill="#173b3b" stroke="#34d399" stroke-width="3"/><text x="793" y="219" fill="#ffffff" font-family="Arial" font-size="25" font-weight="bold">XIAO + Wio-SX1262 A</text><text x="793" y="249" fill="#b6f2d4" font-family="Arial" font-size="22">Meshtastic / Serial PROTO</text><text x="793" y="285" fill="#e2e8f0" font-family="Arial" font-size="20">RX: D3 / GPIO4</text><text x="793" y="314" fill="#e2e8f0" font-family="Arial" font-size="20">TX: D2 / GPIO3</text><rect x="765" y="390" width="455" height="185" rx="22" fill="#3a294e" stroke="#c084fc" stroke-width="3"/><text x="793" y="439" fill="#ffffff" font-family="Arial" font-size="25" font-weight="bold">XIAO + Wio-SX1262 B</text><text x="793" y="469" fill="#ead5ff" font-family="Arial" font-size="22">MeshCore / Serial Companion</text><text x="793" y="505" fill="#e2e8f0" font-family="Arial" font-size="20">RX: D7 / GPIO44</text><text x="793" y="534" fill="#e2e8f0" font-family="Arial" font-size="20">TX: D6 / GPIO43</text><g fill="none" stroke-width="4"><path d="M485 325H660V284H765" stroke="#34d399"/><path d="M485 361H680V315H765" stroke="#6ee7b7"/><path d="M485 424H660V503H765" stroke="#c084fc"/><path d="M485 460H680V533H765" stroke="#e9d5ff"/></g><text x="55" y="628" fill="#cbd5e1" font-family="Arial" font-size="21">Both links: 115200 8N1 | 3.3 V logic | common ground | TX crossed to RX</text><text x="55" y="668" fill="#fbbf24" font-family="Arial" font-size="19">Power: Waveshare AXP2101 / J8 3V3 remains conditional on measured spare current and safe XIAO input path.</text></svg>