<path d="M 725 263 H 806" fill="none" stroke="#36c8f4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="728" y="289" width="83" height="24" rx="12" fill="#092439" stroke="#36c8f4" stroke-width="1"/>
<text x="769.5" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#36c8f4" font-weight="bold" text-anchor="middle">B2B SPI</text>
<rect x="402" y="386" width="322" height="183" rx="14" fill="#11243a" stroke="#ffba65" stroke-width="1.7"/>
<text x="420" y="418" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf5ff" font-weight="bold">XIAO ESP32S3 • B / MeshCore</text>
<text x="420" y="439" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#a6bfd4" font-weight="normal">Seeed B2B kit • external UART</text>
<text x="422" y="463" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#edf5ff" font-weight="normal">D7/GPIO44 = radio UART RX</text>
<text x="422" y="491" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#edf5ff" font-weight="normal">D6/GPIO43 = radio UART TX</text>
<text x="422" y="519" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#edf5ff" font-weight="normal">MCU manages SX1262 over B2B</text>
<rect x="813" y="386" width="412" height="183" rx="14" fill="#11243a" stroke="#ffba65" stroke-width="1.7"/>
<text x="831" y="418" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#edf5ff" font-weight="bold">Wio-SX1262 (internal)</text>
<text x="831" y="439" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#a6bfd4" font-weight="normal">Radio daughterboard, NOT host UART</text>
<text x="834" y="464" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#edf5ff" font-weight="normal">SX1262 connected to XIAO via B2B</text>
<text x="834" y="491" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#edf5ff" font-weight="normal">SPI + DIO/RESET/BUSY per variant</text>
<text x="834" y="518" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#edf5ff" font-weight="normal">LoRa U.FL → separate 900 MHz antenna</text>
<path d="M 329 474 H 390" fill="none" stroke="#ffba65" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M 725 474 H 806" fill="none" stroke="#ffba65" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
