<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Communication stack">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#051325"/><stop offset="1" stop-color="#112a45"/></linearGradient><linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#d9efff" stop-opacity="0.21"/><stop offset="1" stop-color="#8bd0f5" stop-opacity="0.07"/></linearGradient><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 z" fill="#85dbff"/></marker><marker id="arr2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 z" fill="#ffba65"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="url(#bg)" stroke="none" stroke-width="1"/>
<rect x="14" y="14" width="1252" height="692" rx="22" fill="none" stroke="#244260" stroke-width="2"/>
<text x="40" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#36c8f4" font-weight="bold">MeshCrossway</text>
<text x="325" y="61" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#edf5ff" font-weight="bold">| Communication stack</text>
<text x="40" y="91" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#a6bfd4" font-weight="normal">One shared UI; two independent native mesh protocols</text>
<rect x="30" y="669" width="1220" height="27" rx="8" fill="#162a40" stroke="#253f57" stroke-width="1"/>
<text x="44" y="688" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#f4bc58" font-weight="normal">Never silently bridge Meshtastic to MeshCore, share keys or imply inter-protocol routing.</text>
<rect x="314" y="130" width="652" height="92" rx="14" fill="#11243a" stroke="#36c8f4" stroke-width="1.7"/>
<text x="332" y="162" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#edf5ff" font-weight="bold">Touchscreen application</text>
<text x="332" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#a6bfd4" font-weight="normal">Waveshare LVGL: chat / map / contacts / settings</text>
<rect x="314" y="250" width="652" height="96" rx="14" fill="#11243a" stroke="#9a9afc" stroke-width="1.7"/>
<text x="332" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#edf5ff" font-weight="bold">Core host services</text>
<text x="332" y="303" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#a6bfd4" font-weight="normal">Message history • GNSS • protocol adapters • queues</text>
<line x1="640" y1="222" x2="640" y2="245" stroke="#36c8f4" stroke-width="3" marker-end="url(#arr)"/>
<rect x="54" y="388" width="547" height="240" rx="14" fill="#11243a" stroke="#36c8f4" stroke-width="1.7"/>
<text x="72" y="420" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#edf5ff" font-weight="bold">Meshtastic path  /  UART1</text>
<text x="72" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#a6bfd4" font-weight="normal">PROTO binary frames, ToRadio / FromRadio</text>
<text x="78" y="466" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#edf5ff" font-weight="normal">XIAO ESP32S3 + Wio-SX1262</text>
<text x="78" y="502" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#edf5ff" font-weight="normal">Native Meshtastic routing and channel model</text>
<text x="78" y="538" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#edf5ff" font-weight="normal">LoRa RF → Meshtastic network</text>
<text x="78" y="574" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#edf5ff" font-weight="normal">Host GPIO39/40 ↔ XIAO GPIO4/3</text>
<rect x="677" y="388" width="547" height="240" rx="14" fill="#11243a" stroke="#ffba65" stroke-width="1.7"/>
<text x="695" y="420" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#edf5ff" font-weight="bold">MeshCore path  /  UART2</text>
<text x="695" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#a6bfd4" font-weight="normal">Companion binary command / response / events</text>
<text x="705" y="466" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#edf5ff" font-weight="normal">XIAO ESP32S3 + Wio-SX1262</text>
<text x="705" y="502" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#edf5ff" font-weight="normal">Native MeshCore contacts and path model</text>
<text x="705" y="538" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#edf5ff" font-weight="normal">LoRa RF → MeshCore network</text>
<text x="705" y="574" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#edf5ff" font-weight="normal">Host GPIO17/18 ↔ XIAO GPIO44/43</text>
<path d="M 539 346 V 369 H 329 V 383" fill="none" stroke="#36c8f4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M 744 346 V 369 H 950 V 383" fill="none" stroke="#ffba65" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
</svg>