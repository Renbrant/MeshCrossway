<text x="946" y="370" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#fa7171" font-weight="bold" text-anchor="middle">NO RE-TX</text>
<line x1="865" y1="421" x2="1029" y2="291" stroke="#fa7171" stroke-width="3"/>
<text x="710" y="491" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf5ff" font-weight="normal">Individual position packet with zero forwarding</text>
<text x="710" y="522" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf5ff" font-weight="normal">No repeater transmission intended</text>
<text x="710" y="553" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf5ff" font-weight="normal">Requires native MT and MC capability tests</text>
