<line x1="388" y1="355" x2="448" y2="355" stroke="#ffba65" stroke-width="2" marker-end="url(#arr)"/>
<text x="93" y="491" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf5ff" font-weight="normal">Repeater transmits when network config allows</text>
<text x="93" y="522" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf5ff" font-weight="normal">Route and flood behavior are protocol-specific</text>
<text x="93" y="553" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf5ff" font-weight="normal">A direct message may traverse repeaters</text>
