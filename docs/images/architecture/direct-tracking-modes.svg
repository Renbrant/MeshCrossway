<text x="289" y="343" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf5ff" font-weight="bold">Repeater</text>
<text x="289" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#a6bfd4" font-weight="normal">RELAY</text>
<rect x="456" y="311" width="118" height="91" rx="14" fill="#11243a" stroke="#38516d" stroke-width="1.7"/>
<text x="474" y="343" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#edf5ff" font-weight="bold">Device B</text>
<text x="474" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#a6bfd4" font-weight="normal">RX</text>
