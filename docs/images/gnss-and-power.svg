<text x="44" y="688" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#f4bc58" font-weight="normal">Confirm GNSS antenna bias, LiPo protection/connector polarity, battery fit, and power-source isolation.</text>
