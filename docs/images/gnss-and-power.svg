<text x="81" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#edf5ff" font-weight="normal">USB-C 5 V → internal power path</text>
<text x="81" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#edf5ff" font-weight="normal">Protected 1S LiPo → BAT port</text>
