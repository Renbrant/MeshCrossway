<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc">
<title id="title">MeshCrossway | LoRa V3 radio wiring</title><desc id="desc">Proposed, not bench-tested. U1 photo numbers follow the Amazon illustration. Check actual PCB GPIO labels.</desc>
<rect width="1280" height="950" fill="#f3f6fa"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<text x="40" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#182b42" font-weight="700" text-anchor="start">MeshCrossway | LoRa V3 radio wiring</text>
<text x="40" y="82" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#53657a" font-weight="400" text-anchor="start">Proposed, not bench-tested. U1 photo numbers follow the Amazon illustration. Check actual PCB GPIO labels.</text>
<rect x="40" y="120" width="480" height="650" rx="16" fill="white" stroke="#ced8e4" stroke-width="2"/>
<path d="M56 120H504Q520 120 520 136V172H40V136Q40 120 56 120" fill="#1768b5"/>
<text x="60" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="white" font-weight="700" text-anchor="start">Waveshare ESP32-S3 controller</text>
<rect x="770" y="120" width="470" height="290" rx="16" fill="white" stroke="#ced8e4" stroke-width="2"/>
<path d="M786 120H1224Q1240 120 1240 136V172H770V136Q770 120 786 120" fill="#1768b5"/>
<text x="790" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="white" font-weight="700" text-anchor="start">Radio A | Meshtastic</text>
<rect x="770" y="450" width="470" height="290" rx="16" fill="white" stroke="#ced8e4" stroke-width="2"/>
<path d="M786 450H1224Q1240 450 1240 466V502H770V466Q770 450 786 450" fill="#8553b5"/>
<text x="790" y="484" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="white" font-weight="700" text-anchor="start">Radio B | MeshCore</text>
<text x="65" y="218" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="700" text-anchor="start">Photo 9 / GPIO39 / TX</text>
<text x="795" y="218" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="700" text-anchor="start">GPIO4 / configured RX</text>
<path d="M520 230L770 230" fill="none" stroke="#1768b5" stroke-width="3" marker-end="url(#arrow)"/>
<text x="65" y="288" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="700" text-anchor="start">Photo 11 / GPIO40 / RX</text>
<text x="795" y="288" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="700" text-anchor="start">GPIO5 / configured TX</text>
<path d="M770 300L520 300" fill="none" stroke="#087f68" stroke-width="3" marker-end="url(#arrow)"/>
<text x="65" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="700" text-anchor="start">Photo 16 / GPIO17 / TX</text>
<text x="795" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="700" text-anchor="start">GPIO4 / configured RX</text>
<path d="M520 560L770 560" fill="none" stroke="#8553b5" stroke-width="3" marker-end="url(#arrow)"/>
<text x="65" y="618" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="700" text-anchor="start">Photo 18 / GPIO18 / RX</text>
<text x="795" y="618" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="700" text-anchor="start">GPIO5 / configured TX</text>
<path d="M770 630L520 630" fill="none" stroke="#087f68" stroke-width="3" marker-end="url(#arrow)"/>
<text x="795" y="195" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#182b42" font-weight="400" text-anchor="start">LoRa V3: ESP32-S3 + SX1262</text>
<text x="795" y="370" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#182b42" font-weight="400" text-anchor="start">PROTO: RX4 / TX5, 115200 8N1</text>
<text x="795" y="525" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#182b42" font-weight="400" text-anchor="start">Second board from the two-pack</text>
<text x="795" y="700" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#8553b5" font-weight="700" text-anchor="start">Build flags: SERIAL_RX=4 / SERIAL_TX=5</text>
<text x="65" y="710" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#53657a" font-weight="400" text-anchor="start">UART0 GPIO43/44 reserved for diagnostics</text>
<text x="65" y="745" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#53657a" font-weight="400" text-anchor="start">Camera absent; camera driver disabled</text>
<rect x="40" y="795" width="1200" height="110" rx="16" fill="white" stroke="#ced8e4" stroke-width="2"/>
<path d="M56 795H1224Q1240 795 1240 811V847H40V811Q40 795 56 795" fill="#596775"/>
<text x="60" y="829" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="white" font-weight="700" text-anchor="start">3.3 V signals + common ground + separate USB power</text>
<text x="65" y="877" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182b42" font-weight="400" text-anchor="start">U1 GND -&gt; A GND + B GND. No shared 3V3, 5V or battery power outputs.</text>
<text x="40" y="932" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#53657a" font-weight="400" text-anchor="start">Radio GPIO4/5 routing must match the Heltec V3 reference. Isolate UART wires before independent power-off.</text>
</svg>