<text x="40" y="82" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#53657a" font-weight="400" text-anchor="start">Rev2 J8 schematic numbering. Logical wiring, not a physical board layout. All UART signals: 3.3 V.</text>
<rect x="40" y="120" width="480" height="650" rx="16" fill="white" stroke="#ced8e4" stroke-width="2"/>
