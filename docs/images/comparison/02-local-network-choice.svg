<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="818" viewBox="0 0 1120 818" role="img" aria-labelledby="title desc">
<title id="title">Choose around your people and places</title><desc id="desc">An illustrative neighborhood contrasts a real two-way exchange between home and a contact with untested map markers. Three steps explain the decision: identify the people, test messages and replies in the places that matter, and try the real device during everyday use. The drawing is not a real map or a coverage claim.</desc>
<defs>
  <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#2867B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#087F76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#7548BD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1120" height="818" rx="24" fill="#F3F6FA"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#162D46">

<text x="40" y="54" font-size="32" fill="#162D46" font-weight="700" text-anchor="start">Choose around your people and places</text>
<text x="40" y="91" font-size="21" fill="#52677D" font-weight="400" text-anchor="start">A map helps you find a community. A real conversation helps you choose a network.</text>
<rect x="32" y="124" width="638" height="541" rx="18" fill="white" stroke="#D8E1EB" stroke-width="1.5"/>
<rect x="696" y="124" width="392" height="151" rx="18" fill="white" stroke="#D8E1EB" stroke-width="1.5"/>
<rect x="696" y="292" width="392" height="172" rx="18" fill="white" stroke="#D8E1EB" stroke-width="1.5"/>
<rect x="696" y="482" width="392" height="183" rx="18" fill="white" stroke="#D8E1EB" stroke-width="1.5"/>
<rect x="52" y="144" width="598" height="354" rx="14" fill="#F1F5EE" stroke="none" stroke-width="0"/>
<path d="M54 426 C181 376 147 268 271 225 S475 250 648 176" fill="none" stroke="#DCEAF4" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
<path d="M70 369 H620 M187 162 V477 M454 165 V476" fill="none" stroke="#FFFFFF" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" />
<path d="M70 369 H620 M187 162 V477 M454 165 V476" fill="none" stroke="#D4DECF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/>
<path d="M334 190 L370 160 L414 205" fill="#E4ECDF" stroke="#C9D8C2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M352 214 L408 162 L460 211" fill="#E6EEE2" stroke="#C9D8C2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M531 428 L566 393 L612 442" fill="#E4ECDF" stroke="#C9D8C2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M85 328 L122 294 L159 328 M95 321 V363 H150 V321" fill="#FFFFFF" stroke="#162D46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<rect x="112" y="337" width="17" height="26" rx="1" fill="#E4EDF5" stroke="#162D46" stroke-width="2"/>
<g transform="translate(335 316) scale(0.59)">
<circle cx="0" cy="0" r="14" fill="#DFE9F3" stroke="#162D46" stroke-width="2.8"/>
<path d="M-20 57 V35 Q-20 21 0 21 Q20 21 20 35 V57" fill="#EAF0F6" stroke="#162D46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M-10 58 V80 M10 58 V80" fill="none" stroke="#162D46" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</g>
<path d="M169 321 Q238 270 309 321" fill="none" stroke="#2867B2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
<rect x="171" y="247" width="177" height="39" rx="11" fill="white" stroke="#2867B2" stroke-width="2"/>
<text x="259.5" y="272.62" font-size="18" fill="#2867B2" font-weight="600" text-anchor="middle">Message + reply</text>
<text x="122" y="396" font-size="20" fill="#162D46" font-weight="700" text-anchor="middle">Home</text>
<text x="335" y="396" font-size="20" fill="#162D46" font-weight="700" text-anchor="middle">Your contact</text>
<circle cx="509" cy="214" r="10" fill="white" stroke="#9CAEBB" stroke-width="2.5"/>
<circle cx="555" cy="257" r="10" fill="white" stroke="#9CAEBB" stroke-width="2.5"/>
<circle cx="591" cy="193" r="10" fill="white" stroke="#9CAEBB" stroke-width="2.5"/>
<circle cx="560" cy="329" r="10" fill="white" stroke="#9CAEBB" stroke-width="2.5"/>
<circle cx="514" cy="306" r="10" fill="white" stroke="#9CAEBB" stroke-width="2.5"/>
<text x="551" y="365" font-size="18" fill="#52677D" font-weight="400" text-anchor="middle">Map markers</text>
<text x="551" y="389" font-size="18" fill="#52677D" font-weight="400" text-anchor="middle">Still to check</text>
<text x="73" y="476" font-size="17" fill="#52677D" font-weight="400" text-anchor="start">Illustrative neighborhood — not coverage data</text>
<circle cx="78" cy="537" r="9" fill="#2867B2" stroke="none" stroke-width="2"/>
<text x="101" y="544" font-size="20" fill="#162D46" font-weight="600" text-anchor="start">A real exchange answers the question:</text>
<text x="72" y="579" font-size="24" fill="#162D46" font-weight="700" text-anchor="start">Can these people reach each other here?</text>
<text x="72" y="615" font-size="20" fill="#52677D" font-weight="400" text-anchor="start">Many markers elsewhere do not answer it.</text>
<text x="72" y="644" font-size="20" fill="#52677D" font-weight="400" text-anchor="start">Test one ecosystem and one configuration at a time.</text>
<circle cx="728" cy="158" r="15" fill="#087F76" stroke="none" stroke-width="2"/>
<text x="728" y="165" font-size="19" fill="white" font-weight="700" text-anchor="middle">1</text>
<text x="756" y="166" font-size="23" fill="#162D46" font-weight="700" text-anchor="start">Find your people</text>
<text x="720" y="207" font-size="20" fill="#52677D" font-weight="400" text-anchor="start">Who do you want to reach?</text>
<text x="720" y="234" font-size="20" fill="#52677D" font-weight="400" text-anchor="start">Ask which network and settings</text>
<text x="720" y="261" font-size="20" fill="#52677D" font-weight="400" text-anchor="start">their group actually uses.</text>
<circle cx="728" cy="326" r="15" fill="#7548BD" stroke="none" stroke-width="2"/>
<text x="728" y="333" font-size="19" fill="white" font-weight="700" text-anchor="middle">2</text>
<text x="756" y="334" font-size="23" fill="#162D46" font-weight="700" text-anchor="start">Test your places</text>
<text x="720" y="375" font-size="19" fill="#52677D" font-weight="400" text-anchor="start">Try home, the trail and the places</text>
<text x="720" y="401" font-size="19" fill="#52677D" font-weight="400" text-anchor="start">that matter to you. Send messages</text>
<text x="720" y="427" font-size="19" fill="#52677D" font-weight="400" text-anchor="start">and get replies; a visible marker</text>
<text x="720" y="453" font-size="19" fill="#52677D" font-weight="400" text-anchor="start">does not guarantee a usable link.</text>
<circle cx="728" cy="516" r="15" fill="#2867B2" stroke="none" stroke-width="2"/>
<text x="728" y="523" font-size="19" fill="white" font-weight="700" text-anchor="middle">3</text>
<text x="756" y="524" font-size="23" fill="#162D46" font-weight="700" text-anchor="start">Try your routine</text>
<text x="720" y="565" font-size="19" fill="#52677D" font-weight="400" text-anchor="start">Use the actual radio and app.</text>
<text x="720" y="591" font-size="19" fill="#52677D" font-weight="400" text-anchor="start">Check the screen, carrying setup,</text>
<text x="720" y="617" font-size="19" fill="#52677D" font-weight="400" text-anchor="start">battery and configuration before</text>
<text x="720" y="643" font-size="19" fill="#52677D" font-weight="400" text-anchor="start">committing to the system.</text>
<rect x="32" y="688" width="1056" height="87" rx="18" fill="#E9F0F8" stroke="#D9E3EF" stroke-width="1.5"/>
<text x="56" y="724" font-size="24" fill="#162D46" font-weight="700" text-anchor="start">Choose MT, MC or both from the experience you can reproduce.</text>
<text x="56" y="754" font-size="20" fill="#52677D" font-weight="400" text-anchor="start">The strongest local network can be different from the one that fits a remote trip.</text>
<text x="40" y="801" font-size="17" fill="#52677D" font-weight="400" text-anchor="start">Map visibility and local radio delivery are different things. Use the linked maps, then verify in the field.</text>
</g></svg>
