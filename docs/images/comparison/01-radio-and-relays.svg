<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="784" viewBox="0 0 1120 784" role="img" aria-labelledby="title desc">
<title id="title">Your message travels by radio</title><desc id="desc">Two schematic scenes apply to both Meshtastic and MeshCore. Nearby compatible radios exchange messages directly. A suitably placed elevated relay can receive and retransmit messages between users with an obstructed direct path. A phone is the interface; the radio provides the over-the-air link. These scenes are not coverage predictions.</desc>
<defs>
  <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#2867B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#087F76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#7548BD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1120" height="784" rx="24" fill="#F3F6FA"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#162D46">

<text x="40" y="54" font-size="32" fill="#162D46" font-weight="700" text-anchor="start">Your message travels by radio</text>
<text x="40" y="91" font-size="21" fill="#52677D" font-weight="400" text-anchor="start">Both Meshtastic and MeshCore can work without mobile service or the Internet.</text>
<rect x="32" y="126" width="516" height="450" rx="18" fill="white" stroke="#D8E1EB" stroke-width="1.5"/>
<rect x="572" y="126" width="516" height="450" rx="18" fill="white" stroke="#D8E1EB" stroke-width="1.5"/>
<text x="56" y="166" font-size="25" fill="#162D46" font-weight="700" text-anchor="start">01  Nearby users</text>
<text x="56" y="201" font-size="21" fill="#52677D" font-weight="400" text-anchor="start">A message can go straight from one</text>
<text x="56" y="230" font-size="21" fill="#52677D" font-weight="400" text-anchor="start">compatible radio to the other.</text>
<text x="596" y="166" font-size="25" fill="#162D46" font-weight="700" text-anchor="start">02  A relay extends the route</text>
<text x="596" y="201" font-size="20" fill="#52677D" font-weight="400" text-anchor="start">A well-placed relay can pass a message</text>
<text x="596" y="230" font-size="20" fill="#52677D" font-weight="400" text-anchor="start">between people who cannot connect directly.</text>
