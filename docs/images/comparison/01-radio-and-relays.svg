<text x="117" y="474" font-size="20" fill="#162D46" font-weight="600" text-anchor="middle">You</text>
<text x="461" y="474" font-size="20" fill="#162D46" font-weight="600" text-anchor="middle">Your contact</text>
<text x="56" y="518" font-size="21" fill="#52677D" font-weight="400" text-anchor="start">No relay is needed when both radios</text>
<text x="56" y="547" font-size="21" fill="#52677D" font-weight="400" text-anchor="start">can hear and answer each other.</text>
