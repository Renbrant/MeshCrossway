<text x="648" y="670" font-size="20" fill="#52677D" font-weight="400" text-anchor="start">The hardware that sends and receives.</text>
<text x="40" y="756" font-size="18" fill="#52677D" font-weight="400" text-anchor="start">Schematic only. Use one ecosystem and matching settings. Relay behavior depends on configuration.</text>
