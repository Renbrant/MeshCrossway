<text x="915" y="344" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#182b42" font-weight="400" text-anchor="start">USB-C = independent power</text>
<text x="915" y="388" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#182b42" font-weight="400" text-anchor="start">GPIO43/44 = reserve for USB UART</text>
<text x="915" y="432" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#182b42" font-weight="400" text-anchor="start">3V3 / 5V = no jumper to U1</text>
<text x="915" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#182b42" font-weight="400" text-anchor="start">Other GPIOs = leave disconnected</text>
