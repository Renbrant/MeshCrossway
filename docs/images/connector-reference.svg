<text x="915" y="963" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#182b42" font-weight="400" text-anchor="start">Do not attach a camera in this build.</text>
<text x="40" y="1044" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#53657a" font-weight="400" text-anchor="start">Colored pins are used by this proposal. Black labels are reference only; leave all other header pins disconnected.</text>
