    <rect x="38" y="236" width="534" height="48" rx="10" fill="#0b1822" stroke="#203646"/><text x="54" y="261" class="t" font-size="11" font-weight="700">Alex</text><text x="95" y="261" class="mt" font-size="9" font-weight="700">MT</text><text x="54" y="274" class="t m" font-size="9">Copy. Staying on channel.</text><text x="520" y="261" class="t m" font-size="9">stored</text>
