    <text x="60" y="222" class="mc" font-weight="700">MC</text><text x="88" y="217" class="t" font-weight="700">SAR Base</text><text x="88" y="228" class="t m" font-size="8">Weather moving in from the west.</text>
    <rect x="50" y="240" width="300" height="31" rx="7" fill="#0a1720" stroke="#203646"/>
