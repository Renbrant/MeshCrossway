  </g>
  <rect x="388" y="72" width="198" height="42" rx="10" fill="#eaf7ff"/>
  <text x="438" y="98" fill="#06111a" font-family="Arial" font-size="12" font-weight="700">+ New message</text>
  <rect x="388" y="126" width="198" height="43" rx="9" fill="#0a1720" stroke="#244052"/><text x="402" y="151" class="t" font-size="11">⌖  Position</text>
  <rect x="388" y="178" width="198" height="43" rx="9" fill="#0a1720" stroke="#244052"/><text x="402" y="203" class="t" font-size="11">⌁  Radio status</text>
