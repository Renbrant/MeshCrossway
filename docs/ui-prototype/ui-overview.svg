  <rect x="205" y="108" width="145" height="48" rx="8" fill="#0a1720" stroke="#ffad4a" stroke-opacity=".45"/>
  <text x="217" y="129" class="t" font-size="11" font-weight="700">MeshCore</text><text x="320" y="129" class="mc" font-size="9" font-weight="700">MC</text>
  <text x="217" y="146" class="t m" font-size="9">Companion · 3 contacts</text>
  <g font-size="10">
    <rect x="50" y="166" width="300" height="31" rx="7" fill="#0a1720" stroke="#203646"/>
