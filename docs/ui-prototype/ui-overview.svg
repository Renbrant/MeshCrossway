  <rect x="20" y="20" width="580" height="38" rx="12" fill="#091620"/>
  <text x="36" y="45" class="t" font-size="14" font-weight="700">MeshCrossway</text>
  <circle cx="452" cy="39" r="5" class="ok"/><text x="464" y="43" class="t m" font-size="10">GNSS 3D</text>
  <text x="545" y="43" class="t m" font-size="10">14:37</text>
  <rect x="34" y="72" width="340" height="212" rx="10" class="p"/>
