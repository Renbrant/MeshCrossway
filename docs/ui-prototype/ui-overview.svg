  <g stroke="#315060" stroke-opacity=".35"><path d="M38 108h350M38 148h350M38 188h350"/><path d="M98 68v158M158 68v158M218 68v158M278 68v158M338 68v158"/></g>
  <circle cx="244" cy="145" r="9" fill="#e9f7ff" stroke="#188faa" stroke-width="4"/><circle cx="145" cy="110" r="6" class="mt"/><circle cx="320" cy="184" r="6" class="mc"/><circle cx="188" cy="196" r="6" class="mt"/>
  <rect x="404" y="68" width="168" height="46" rx="9" class="p"/><text x="416" y="87" class="t m" font-size="8">GNSS FIX</text><text x="416" y="103" class="t" font-size="11" font-weight="700">3D · 12 sats · 2 s</text>
