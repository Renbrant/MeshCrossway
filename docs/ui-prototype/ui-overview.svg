  <rect x="404" y="180" width="168" height="46" rx="9" class="p"/><text x="416" y="199" class="t m" font-size="8">NEARBY</text><text x="416" y="215" class="t" font-size="11" font-weight="700">7 peers · 4 MT · 3 MC</text>
  <text x="0" y="330" class="t" font-size="16" font-weight="700">Position / GNSS</text>
</g>

