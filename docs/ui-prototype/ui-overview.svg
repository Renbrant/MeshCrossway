    <rect x="38" y="120" width="534" height="48" rx="10" fill="#0b1822" stroke="#203646"/><text x="54" y="145" class="t" font-size="11" font-weight="700">Trail Team</text><text x="145" y="145" class="mt" font-size="9" font-weight="700">MT</text><text x="54" y="158" class="t m" font-size="9">Reached checkpoint 3. All good.</text><text x="520" y="145" class="ok" font-size="9">ACK</text>
