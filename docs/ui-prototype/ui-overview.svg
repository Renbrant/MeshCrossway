<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071018"/><stop offset="1" stop-color="#0b1a25"/></linearGradient>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#f3f7fa}.m{fill:#91a7b7}.p{fill:#0d1a24;stroke:#284052}.mt{fill:#28d7c0}.mc{fill:#ffad4a}.ok{fill:#69e27f}
  </style>
</defs>
<rect width="1400" height="900" fill="#03080d"/>
<text x="60" y="56" class="t" font-size="28" font-weight="700">MeshCrossway UI prototype v0</text>
<text x="60" y="84" class="t m" font-size="16">480×320 touchscreen concept • browser mockup • demo data only</text>

<!-- HOME -->
<g transform="translate(60 120)">
  <rect width="620" height="360" rx="22" fill="#101820" stroke="#334653" stroke-width="2"/>
